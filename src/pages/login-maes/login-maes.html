<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../assets/css/cadastro-profissional.css">
    <link rel="stylesheet" href="../cadastro/css/cadastro-maes.css">
    <link rel="stylesheet" href="css/login-maes.css">
    <title>Login - Mães em Foco</title>
</head>

<body>
    <div class="topo-pagina">
        <img src="../../assets/img/logo.png" alt="Mães em Foco" id="logo-fundo">
        <a href="javascript:history.back()" class="voltar-btn" aria-label="Voltar">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
            </svg>
        </a>
    </div>

    <main class="container" id="conteudo-principal">
        <form id="form-login" novalidate>
            <h1>Login</h1>

            <div class="input-box">
                <label for="email">Email</label>
                <input placeholder="exemplo@email.com" type="email" id="email" autocomplete="email">
            </div>
            <p class="aviso-campo" id="aviso-email"></p>

            <div class="input-box">
                <label for="senha">Senha</label>
                <div class="senha-wrapper">
                    <input placeholder="****************" type="password" maxlength="14" id="senha"
                        autocomplete="current-password">
                    <span class="olho-senha" id="btn-olho" role="button" aria-label="Mostrar senha" tabindex="0">
                        <svg id="icone-olho" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke-width="1.5" stroke="currentColor" width="24" height="24">
                            <path class="olho-visivel"
                                d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z" />
                            <circle class="olho-visivel" cx="12" cy="12" r="3" />
                            <line class="olho-oculto" x1="2" y1="2" x2="22" y2="22" />
                        </svg>
                    </span>
                </div>
            </div>
            <p class="aviso-campo" id="aviso-senha"></p>

            <a href="../../senha.html" class="link-esqueci">Esqueci minha senha</a>

            <button type="submit" class="prof">Entrar</button>

            <div class="profissional">
                <span>Não tem conta? <a href="/src/index.html"  class="conta"><b>Criar conta</b></a></span>
            </div>
        </form>
    </main>

    <div id="tela-sucesso" class="tela-sucesso" style="display: none;">
        <div class="card-notificacao">
            <div class="mensagem-sucesso">
                Login realizado com sucesso! Bem-vinda de volta.
            </div>
            <button type="button" id="btn-fechar-sucesso" class="btn-ok">OK</button>
        </div>
    </div>

    <script src="../../assets/js/auth-maes-storage.js"></script>
    <script src="../../assets/js/cadastro-sucesso.js"></script>
    <script src="../../assets/js/login-maes.js"></script>
</body>

</html>
