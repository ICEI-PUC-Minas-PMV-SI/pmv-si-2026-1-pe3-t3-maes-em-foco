<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/userprofile.css" />
    <link rel="stylesheet" href="assets/css/global.css" /> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <title>Perfil | Mães em Foco</title>
  </head>
  <body>
    <header-component></header-component>

   <div class="user-info">
    

    <div class="profile-body">
        <div class="profile-picture-container">
        <img src="assets/img/no-photo.jpg" alt="Foto" class="profile-picture" id="profilePreview">
        </div>
        <div class="profile-header">
        <h1><strong id="name">Nome de Usuário</strong></h1>
        <a href="edit-userprofile.html" style="color: #666; font-size: 0.9rem;"><i class="fa-solid fa-gear"></i> Editar Perfil</a>
    </div>
        <div class="profile-details">
            <p id="profiletype">Categoria</p>
            <p id="children">Filhos</p>
            <p id="location">Localização</p>
        </div>
    </div>

    <div class="profile-bio">
        <p id="bio">Uma breve descrição sobre mim.</p>
    </div>
</div>

    <section class="profile-right">
        <div class="profile-posts-header">
          <h2>Meus Posts</h2>
          <button class="btn new-post-btn">Novo Post <i class="fa-solid fa-plus"></i></button>
        </div>

        <div class="posts-section"></div>

      </section>
    </div>

  <script src="assets/footer.js"></script>
    <script src="assets/navbar.js"></script>
    <script src="assets/js/userprofile.js"></script>
    <script src="assets/js/userposts.js"></script>
  </body>
</html>
