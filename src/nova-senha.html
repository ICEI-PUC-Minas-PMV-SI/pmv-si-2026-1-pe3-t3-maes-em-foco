<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/nova-senha.css">
  <title>Recuperação de senha</title>
</head>
<body>

  <div class="topo-pagina">
    <a href="javascript:history.back()" class="voltar-btn">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width: 100%; height: 100%;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
      </svg>
    </a>
    <img src="assets/img/logo.png" alt="Mães em Foco" id="logo-fundo">
  </div>

  <main class="container">
    <form id="form-login">
      <h1>Redefinir senha</h1>
      <p class="paragrafo1">Escolha sua nova senha</p>

      <div class="secao-dados">
        <div class="input-box">
          <label for="senha-nova">Nova senha</label>
          <div class="senha-wrapper">
            <input type="password" maxlength="14" id="senha-nova" placeholder="Digite a nova senha">
            <span class="olho-senha" id="btn-olho-nova">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="24" height="24">
                <path class="olho-visivel" d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z" />
                <circle class="olho-visivel" cx="12" cy="12" r="3" />
                <line class="olho-oculto" x1="2" y1="2" x2="22" y2="22" />
              </svg>
            </span>
          </div>
        </div>
        
        <p class="ajuda-texto">Mínimo de 8 caracteres e uma letra maiúscula</p>

        <div class="input-box">
          <label for="confirme">Confirmar senha</label>
          <div class="senha-wrapper">
            <input type="password" maxlength="14" id="confirme" placeholder="Confirme a senha">
            <span class="olho-senha" id="btn-olho-confirme">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="24" height="24">
                <path class="olho-visivel" d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z" />
                <circle class="olho-visivel" cx="12" cy="12" r="3" />
                <line class="olho-oculto" x1="2" y1="2" x2="22" y2="22" />
              </svg>
            </span>
          </div>
        </div>
      </div>

      <button type="submit" class="new">Confirmar</button>
    </form>
  </main>

  <div id="tela-sucesso" class="tela-sucesso" style="display: none;">
    <div class="card-notificacao">
        <div class="mensagem-sucesso">
            Sucesso! Sua senha foi redefinida com sucesso. Clique em OK para voltar à tela de login.
        </div>
        <button type="button" id="btn-fechar-sucesso" class="btn-ok">OK</button>
    </div>
  </div>

  <script src="assets/js/novasenha.js"></script>
</body>
</html>
