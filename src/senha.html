<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/senha.css">
  <title>Senha de acesso</title>
</head>
<body>

  <div class="topo-pagina">
    <img src="assets/img/logo.png" alt="Mães em Foco" id="logo-fundo">
    <a href="#" class="voltar-btn">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width: 100%; height: 100%;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
      </svg>
    </a>
  </div>

  <main class="container">
    <form id="form-login">
      <h1>Redefinir senha</h1>
      <p class="paragrafo-1">Digite seu e-mail de cadastro</p>

      <div class="secao-dados">
        <div class="input-box">
          <label for="email">E-mail</label>
          <input type="email" id="email" autocomplete="email" placeholder="Ex: nome@email.com" required>
        </div>
      </div>

      <button type="submit" class="chave">Confirmar</button>
    </form>
  </main>

  <div id="tela-sucesso" class="tela-sucesso" style="display: none;">
    <div class="card-notificacao">
      <div class="mensagem-sucesso">
 Enviamos um codigo para confirmação do E-mail. Verifique sua caixa de entrada.
      </div>
      <button type="button" id="btn-fechar-sucesso" class="btn-ok">OK</button>
    </div>
  </div>

  <script src="assets/js/senha.js"></script>
</body>
</html>
